# Builds Windows (.exe), Linux (Flatpak, AppImage) and Android (.apk) and attaches them to a draft release.
# Trigger: push a tag like v1.0.0. Running it by hand from the Actions tab builds everything without publishing.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # one draft release up front, so the Windows and Linux jobs both upload to it (otherwise each creates its own)
  draft:
    runs-on: ubuntu-24.04
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || exit 0
          gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | grep -q . \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" -f tag_name="$TAG" -f name="NEOPOSE ${TAG#v}" -F draft=true >/dev/null

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable
          - os: ubuntu-24.04
            target: --linux flatpak AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Flatpak toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 org.electronjs.Electron2.BaseApp//26.08
      - run: npm ci
      - run: python build.py
      - name: Package and upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
        run: npx electron-builder ${{ matrix.target }} --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: neopose-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.flatpak
            dist/*.AppImage
          if-no-files-found: ignore

  # Android is built the way F-Droid builds it (same Docker image as fdroiddata's CI, Debian's Node and JDK 21,
  # tools/android_sync.py instead of the Capacitor CLI, unsigned Gradle build) and then signed with apksigner,
  # so F-Droid can rebuild it byte for byte and ship our signature (reproducible builds).
  android:
    needs: draft
    runs-on: ubuntu-24.04
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      - name: Toolchain (as in the F-Droid recipe)
        run: |
          apt-get update
          apt-get install -y nodejs npm python3 openjdk-21-jdk-headless apksigner curl git
          update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
      - uses: actions/checkout@v5
      - name: Unsigned release APK
        run: |
          git config --global --add safe.directory "$PWD"
          npm ci --ignore-scripts
          python3 build.py && python3 tools/android_sync.py
          cd android && ./gradlew --no-daemon assembleRelease
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.NEOPOSE_KEYSTORE_B64 }}
          NEOPOSE_KEYSTORE_PASSWORD: ${{ secrets.NEOPOSE_KEYSTORE_PASSWORD }}
          NEOPOSE_KEY_ALIAS: ${{ secrets.NEOPOSE_KEY_ALIAS }}
          NEOPOSE_KEY_PASSWORD: ${{ secrets.NEOPOSE_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*-unsigned.apk | head -1)
          cp "$UNSIGNED" dist/unsigned.apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/neopose.p12"
            # minSdk 24: v2/v3 only; a v1 (JAR) signature would add META-INF entries and shift the whole zip
            apksigner sign --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --ks "$RUNNER_TEMP/neopose.p12" --ks-type PKCS12 --ks-key-alias "$NEOPOSE_KEY_ALIAS" \
              --ks-pass env:NEOPOSE_KEYSTORE_PASSWORD --key-pass env:NEOPOSE_KEY_PASSWORD \
              --in dist/unsigned.apk --out "dist/NEOPOSE-$VERSION-android.apk"
            rm "$RUNNER_TEMP/neopose.p12"
            apksigner verify --print-certs "dist/NEOPOSE-$VERSION-android.apk" | grep -i sha-256
          fi
          ls -la dist
      - name: Attach to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=20" \
            | python3 -c "import json,sys; print([r['id'] for r in json.load(sys.stdin) if r['tag_name'] == '${GITHUB_REF_NAME}'][0])")
          for f in dist/NEOPOSE-*.apk; do
            curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$f" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$ID/assets?name=$(basename "$f")" > /dev/null
          done
      - uses: actions/upload-artifact@v5
        with:
          name: neopose-android
          path: dist/*.apk

  # A second build from scratch, on another machine and in another directory, must give the same APK:
  # apksigcopier copies our signature onto it and checks it verifies, which is what F-Droid does.
  reproducible:
    needs: android
    runs-on: ubuntu-24.04
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      - name: Toolchain (as in the F-Droid recipe)
        run: |
          apt-get update
          apt-get install -y nodejs npm python3 openjdk-21-jdk-headless apksigner apksigcopier git
          update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
      - uses: actions/download-artifact@v5
        with:
          name: neopose-android
          path: first
      - name: Rebuild from the same commit
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/rb/io.github.pmirall.neopose
          cd /tmp/rb/io.github.pmirall.neopose && git checkout -q "$GITHUB_SHA"
          npm ci --ignore-scripts
          python3 build.py && python3 tools/android_sync.py
          cd android && ./gradlew --no-daemon assembleRelease
      - name: Compare
        run: |
          SECOND=$(ls /tmp/rb/io.github.pmirall.neopose/android/app/build/outputs/apk/release/*-unsigned.apk | head -1)
          cmp first/unsigned.apk "$SECOND" && echo "unsigned APKs are identical"
          SIGNED=$(ls first/NEOPOSE-*-android.apk 2>/dev/null | head -1)
          if [ -n "$SIGNED" ]; then apksigcopier compare "$SIGNED" --unsigned "$SECOND" && echo "signed APK reproduces"; fi
