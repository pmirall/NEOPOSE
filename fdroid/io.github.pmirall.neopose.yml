  - Graphics
License: GPL-3.0-or-later
AuthorName: pmirall
SourceCode: https://github.com/pmirall/NEOPOSE
IssueTracker: https://github.com/pmirall/NEOPOSE/issues
Changelog: https://github.com/pmirall/NEOPOSE/releases

AutoName: NEOPOSE

RepoType: git
Repo: https://github.com/pmirall/NEOPOSE.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: 70184bbfc73aab007a4f5a62cbe90fee45b3367f
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y python3 xz-utils
      # Capacitor 8 needs Node 22, newer than Debian's
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
      - echo "df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de /tmp/node.tar.xz" | sha256sum -c
      - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
    init: cd ../.. && npm ci --ignore-scripts
    prebuild: cd ../.. && python3 build.py && npx cap sync android
    scandelete:
      - node_modules
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 10000
